[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

[build]
  command = "bash scripts/install-ytdlp.sh && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  YTDLP_PATH = "netlify/functions/bin/yt-dlp"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/bin/yt-dlp"]

[functions."youtube-resolve"]
  timeout = 26
  external_node_modules = ["@distube/ytdl-core"]

[functions."youtube-stream"]
  timeout = 26

[functions."tts-batch"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
