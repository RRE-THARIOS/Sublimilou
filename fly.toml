# https://fly.io/docs/reference/configuration/
app = 'sublimilou'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'
  YTDLP_PATH = '/usr/local/bin/yt-dlp'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
