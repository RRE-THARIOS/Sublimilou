<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#1a1228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tes subliminaux — playlists, tags, minuteur sommeil" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Subliminaux</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="brand">
          <span class="brand-icon">✦</span>
          <h1>Subliminaux</h1>
        </div>
        <p class="tagline">Pour toi, sans pub</p>
      </header>

      <main id="main"></main>

      <nav class="bottom-nav">
        <button class="nav-btn active" data-view="library" id="nav-library">
          <span>♫</span>
          <span>Biblio</span>
        </button>
        <button class="nav-btn" data-view="playlists" id="nav-playlists">
          <span>☰</span>
          <span>Playlists</span>
        </button>
        <button class="nav-btn" data-view="import" id="nav-import">
          <span>＋</span>
          <span>Ajouter</span>
        </button>
      </nav>

      <footer id="player-bar" class="player-bar hidden">
        <img id="player-thumb" class="player-thumb" alt="" />
        <div class="player-body">
          <p id="player-title" class="player-title">—</p>
          <div id="progress-bar" class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p class="player-meta">
            <span id="player-time">0:00</span>
            <span id="timer-remaining" hidden></span>
          </p>
        </div>
        <div class="player-controls">
          <button id="player-loop" class="icon-btn" data-on="true" title="Boucle">🔁</button>
          <select id="sleep-timer" class="timer-select" title="Minuteur">
            <option value="0">⏱ Off</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">1 h</option>
            <option value="120">2 h</option>
            <option value="480">8 h</option>
          </select>
          <button id="player-play" class="icon-btn play-main">▶</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
